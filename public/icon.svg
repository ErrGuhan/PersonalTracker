<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f131c"/>
      <stop offset="50%" stop-color="#1c2028"/>
      <stop offset="100%" stop-color="#0a0e16"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cd7f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ec6a06"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(76,215,246,0.3)" stroke-width="8"/>

  <!-- Living Glowing Outer Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(76,215,246,0.15)" stroke-width="16"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#4cd7f6" stroke-width="16" stroke-dasharray="1130" stroke-dashoffset="300" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center Thunderbolt Badge -->
  <path d="M280 80L160 272H256L232 432L352 240H256L280 80Z" fill="url(#bolt)" filter="url(#glow)"/>
</svg>
